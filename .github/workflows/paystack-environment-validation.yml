name: Paystack environment validation
on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/paystack-environment-validation.yml"
permissions:
  contents: read
jobs:
  validate-payment-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check payment functions
        run: |
          deno check supabase/functions/create-payment/index.ts
          deno check supabase/functions/verify-payment/index.ts
          deno check supabase/functions/paystack-webhook/index.ts
      - name: Test environment isolation and webhook signatures
        run: |
          deno test supabase/functions/_shared/paystack/config_test.ts
          deno test supabase/functions/paystack-webhook/signature_test.ts
