name: Paystack environment validation
on:
  pull_request:
    branches: [main, feat/paystack-live-mode-guarded, release/paystack-guarded-integrated-candidate, fix/paystack-repeat-verification-entitlement, fix/paystack-period-and-course-payment-backing]
    paths:
      - "supabase/functions/**"
      - "supabase/migrations/20261106141500_enforce_active_account_on_member_definer_rpcs.sql"
      - "supabase/migrations/20261106141600_restrict_backend_only_table_grants.sql"
      - "supabase/migrations/20261106143600_require_paystack_provider_for_confirmation.sql"
      - "supabase/migrations/20261106130000_harden_paystack_refund_accounting.sql"
      - "supabase/migrations/20261107133000_recover_blocked_paystack_entitlements.sql"
      - ".github/workflows/paystack-environment-validation.yml"
permissions:
  contents: read
jobs:
  validate-payment-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check payment functions
        run: |
          deno check supabase/functions/create-payment/index.ts
          deno check supabase/functions/verify-payment/index.ts
          deno check supabase/functions/paystack-webhook/index.ts
      - name: Test environment isolation and webhook signatures
        run: |
          deno test supabase/functions/_shared/paystack/config_test.ts
          deno test supabase/functions/_shared/paystack/metadata_test.ts
          deno test supabase/functions/paystack-webhook/signature_test.ts

      - name: Validate database security migration invariants
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path("supabase/migrations")
          member = (root / "20261106141500_enforce_active_account_on_member_definer_rpcs.sql").read_text().lower()
          grants = (root / "20261106141600_restrict_backend_only_table_grants.sql").read_text().lower()
          provider = (root / "20261106143600_require_paystack_provider_for_confirmation.sql").read_text().lower()
          refunds = (root / "20261106130000_harden_paystack_refund_accounting.sql").read_text().lower()

          member_functions = [
              "get_assessment_for_student",
              "mark_all_notifications_read",
              "mark_notification_read",
              "publish_course_assessment",
              "submit_course_assessment",
              "update_my_profile",
          ]
          for name in member_functions:
              assert f"create or replace function public.{name}" in member, f"Missing member RPC: {name}"
          assert member.count("private.is_active_user()") >= len(member_functions), "Missing active-account guard"
          assert "set search_path to ''" in member, "Empty search_path missing"
          assert "from public, anon" in member and "to authenticated, service_role" in member

          assert "create or replace function private.is_blocked(a uuid, b uuid)" in member
          assert "auth.uid() is distinct from a" in member, "Block lookup is not bound to caller as first party"
          assert "auth.uid() is distinct from b" not in member, "Block lookup allows caller as arbitrary second party"
          assert "revoke all on function private.is_blocked(uuid, uuid) from public, anon" in member
          assert "grant execute on function private.is_blocked(uuid, uuid) to authenticated" in member

          for table in ("public.audit_logs", "public.newsletter_subscribers"):
              assert f"revoke all on table {table} from public, anon, authenticated" in grants
              assert f"grant all on table {table} to service_role" in grants

          for name in ("confirm_course_payment", "confirm_paystack_payment", "confirm_product_payment"):
              assert f"create or replace function public.{name}" in provider
          assert provider.count("payment_row.provider is distinct from 'paystack'") >= 3
          assert "from public, anon, authenticated" in provider
          assert provider.count("to service_role") >= 3
          assert "and s.provider_reference=p_reference" in provider, "Paid subscription retries must verify the matching provider reference"
          assert "and s.plan_code=payment_row.metadata->>'plan_code'" in provider, "Paid subscription retries must verify the purchased plan"
          assert "s.status in ('active','trialing','past_due')" in provider, "Paid subscription retries must require an active entitlement state"
          assert "s.current_period_start <= now()" in provider and "s.current_period_end > now()" in provider, "Paid subscription retries must require a currently valid billing period"
          assert "e.revoked_at is null" in provider, "Paid course retries must reject revoked enrollments"
          assert "from public.payments qualifying_payment" in provider, "Paid course retries must require a qualifying originating payment"
          assert "qualifying_payment.status='paid'" in provider, "Paid course retries must reject refunded originating payments"
          assert "pr.status='processed'" in provider and "pr.payment_id=qualifying_payment.id" in provider, "Paid course retries must account for cumulative refunds"
          assert "e.student_id=payment_row.user_id" in provider, "Paid course retries must bind the learner to the original payment"
          assert "s.user_id=payment_row.user_id" in provider, "Paid subscription retries must bind the account to the original payment"
          assert "from public.product_purchases pp" in provider, "Paid product retries must require an existing purchase record"
          assert "pp.payment_id=payment_row.id" in provider, "Paid product retries must bind the purchase to the original payment"
          assert "pp.product_id::text=payment_row.metadata->>'product_id'" in provider, "Paid product retries must bind the purchased product"
          assert "pp.seller_id::text=payment_row.metadata->>'seller_id'" in provider, "Paid product retries must bind the seller"
          assert "pp.buyer_id=payment_row.user_id" in provider, "Paid product retries must bind the buyer"
          assert "pp.refunded_at is null" in provider, "Paid product retries must reject refunded purchases"

          verify = Path("supabase/functions/verify-payment/index.ts").read_text()
          assert "purpose === 'product_purchase' ? 'confirm_product_payment'" in verify, "Paid retries must route product payments to their confirmation RPC"
          assert "purpose === 'course_enrollment' ? 'confirm_course_payment'" in verify, "Paid retries must route course payments to their confirmation RPC"
          assert "if (payment.status === 'paid')" in verify and "await admin.rpc(rpcName" in verify, "Already-paid verification must revalidate the entitlement in the database"
          assert "verified: entitlementValid === true" in verify, "Already-paid verification must report only a confirmed entitlement"
          assert "entitlementValid === true ? 200 : 409" in verify, "Missing entitlements must fail closed with a conflict response"

          checkout = Path("supabase/functions/create-payment/index.ts").read_text()
          assert "Number.isSafeInteger(coursePriceMinor)" in checkout, "Course checkout must reject unsafe or fractional minor-unit prices"
          assert "amountMinor = coursePriceMinor" in checkout, "Course checkout must use the validated minor-unit amount"

          assert "refund_reference text not null unique" in refunds, "Refund reference must be unique"
          assert "for update" in refunds, "Refund processing must lock the payment row"
          assert "on conflict (refund_reference) do nothing" in refunds, "Duplicate refund delivery must be idempotent"
          assert "refund_row.amount_minor <> p_amount_minor" in refunds, "Duplicate refund references must reject altered amounts"
          assert "refund_row.transaction_reference <> p_transaction_reference" in refunds, "Refund references must remain bound to their transaction"
          assert "sum(amount_minor)" in refunds and "refunded_total > payment_row.amount_minor" in refunds, "Cumulative refunds must not exceed the original payment"
          assert "if fully_refunded then" in refunds, "Entitlement revocation must be gated on full refund"
          assert "set revoked_at = coalesce(revoked_at" in refunds, "Full refunds must revoke paid course access/certificates"
          assert provider.count("pg_advisory_xact_lock") >= 2, "Course refunds and confirmations must share the serialization lock"
          assert "qualifying_payment.id <> payment_row.id" in provider, "Refund A must not treat itself as a backing purchase"
          assert "qualifying_payment.status = 'paid'" in provider, "Only another paid purchase may preserve course access"
          assert "qualifying_payment.metadata->>'course_id' = payment_row.metadata->>'course_id'" in provider, "Backing purchase must match the same course"
          assert "pg_advisory_xact_lock" in provider, "Course confirmation must use the shared refund/repurchase lock"
          assert provider.count("hashtext(payment_row.metadata->>'course_id')") >= 2, "Refund and confirmation must lock the same course key"
          assert provider.count("hashtext(payment_row.user_id::text)") >= 2, "Refund and confirmation must lock the same learner key"
          assert "set refunded_at = coalesce(refunded_at" in refunds, "Full refunds must mark digital-product purchases refunded"
          assert "set status = 'cancelled'" in refunds and "provider_reference = p_transaction_reference" in refunds, "Full refunds must cancel the matching Paystack subscription"
          assert "if fully_refunded then" in refunds, "Partial refunds must not enter the entitlement-revocation branch"
          assert "from public, anon, authenticated" in refunds and "to service_role" in refunds, "Refund RPC must remain service-role only"
          recovery = (root / "20261107133000_recover_blocked_paystack_entitlements.sql").read_text().lower()
          for required in (
              "entitlement_blocked_reason' is distinct from 'account_not_active'",
              "payment_refunds",
              "pg_advisory_xact_lock",
              "on conflict(course_id,student_id) do update set revoked_at=null",
              "pp.refunded_at is not null",
              "subscription_period_expired",
              "newer_active_subscription_exists",
              "revoke all on function public.recover_blocked_paystack_entitlement(text,bigint,text) from public,anon,authenticated",
              "grant execute on function public.recover_blocked_paystack_entitlement(text,bigint,text) to service_role",
          ):
              assert required in recovery, f"Missing blocked-payment recovery guard: {required}"
          assert "recover_blocked_paystack_entitlement" in verify, "Paid verification must invoke guarded entitlement recovery"
          assert "entitlement_blocked_reason === 'account_not_active'" in verify, "Recovery must be restricted to the inactive-account marker"
          print("Database security, refund-accounting, and blocked-entitlement recovery assertions passed.")
          PY
