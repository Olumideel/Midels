name: Security migration validation
on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/20261106141500_enforce_active_account_on_member_definer_rpcs.sql"
      - "supabase/migrations/20261106141600_restrict_backend_only_table_grants.sql"
      - "supabase/migrations/20261106141700_require_paystack_provider_for_confirmation.sql"
      - ".github/workflows/security-migration-validation.yml"
permissions:
  contents: read
jobs:
  validate-security-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert database security migration invariants
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path("supabase/migrations")
          member = (root / "20261106141500_enforce_active_account_on_member_definer_rpcs.sql").read_text().lower()
          grants = (root / "20261106141600_restrict_backend_only_table_grants.sql").read_text().lower()
          provider = (root / "20261106141700_require_paystack_provider_for_confirmation.sql").read_text().lower()

          member_functions = [
              "get_assessment_for_student",
              "mark_all_notifications_read",
              "mark_notification_read",
              "publish_course_assessment",
              "submit_course_assessment",
              "update_my_profile",
          ]
          for name in member_functions:
              assert f"create or replace function public.{name}" in member, f"Missing member RPC definition: {name}"
          assert member.count("private.is_active_user()") >= len(member_functions), "Not every member RPC has an active-account guard"
          assert "set search_path to ''" in member, "Member RPCs must pin an empty search_path"
          assert "revoke all on function public." in member and "from public, anon" in member, "Client EXECUTE revocation missing"
          assert "grant execute on function public." in member and "to authenticated, service_role" in member, "Expected member RPC grants missing"

          assert "create or replace function private.is_blocked(a uuid, b uuid)" in member
          assert "auth.uid() is distinct from a" in member, "Block lookup must bind caller to first argument"
          assert "auth.uid() is distinct from b" not in member, "Block lookup must not allow caller as arbitrary second argument"
          assert "revoke all on function private.is_blocked(uuid, uuid) from public, anon" in member
          assert "grant execute on function private.is_blocked(uuid, uuid) to authenticated" in member

          for table in ("public.audit_logs", "public.newsletter_subscribers"):
              assert f"revoke all on table {table} from public, anon, authenticated" in grants
              assert f"grant all on table {table} to service_role" in grants
          assert "has_table_privilege('anon'" in grants and "has_table_privilege('authenticated'" in grants

          for name in ("confirm_course_payment", "confirm_paystack_payment", "confirm_product_payment"):
              assert f"create or replace function public.{name}" in provider, f"Missing payment confirmation RPC: {name}"
          assert provider.count("payment_row.provider is distinct from 'paystack'") >= 3, "Provider isolation must exist in all confirmation RPCs"
          assert "from public, anon, authenticated" in provider
          assert provider.count("to service_role") >= 3, "Backend execution grants missing"
          assert "search_path" in provider and "search_path=\"\"" in provider, "Empty search_path assertions missing"

          print("Security migration static assertions passed.")
          PY
