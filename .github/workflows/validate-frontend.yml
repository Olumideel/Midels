name: Frontend JavaScript validation

on:
  pull_request:
    branches:
      - main
      - release/paystack-guarded-integrated-candidate
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  syntax-check:
    name: Check frontend JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate app.js syntax
        run: node --check app.js
      - name: Assert refunded purchases are excluded from owned marketplace items
        run: |
          node --input-type=commonjs - <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('app.js', 'utf8');
          if (!source.includes("select('product_id,refunded_at,payments(status)').eq('buyer_id',STATE.currentUser.id).is('refunded_at',null)")) {
            throw new Error('Marketplace ownership query must exclude refunded purchase records.');
          }
          if (!source.includes("filter(x=>x.payments?.status==='paid')")) {
            throw new Error('Marketplace ownership state must require a paid linked payment.');
          }
          NODE
