name: Certificate privacy validation
on:
  pull_request:
    branches: [feat/paystack-live-mode-guarded]
    paths:
      - "app.js"
      - "supabase/migrations/*minimize_public_certificate_verification_data.sql"
      - ".github/workflows/certificate-privacy-validation.yml"
permissions:
  contents: read
jobs:
  validate-certificate-privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate frontend JavaScript syntax
        run: node --check app.js
      - name: Assert public verifier minimizes personal data
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path("app.js").read_text()
          migration = Path("supabase/migrations/20261106143500_minimize_public_certificate_verification_data.sql").read_text()
          chunks = migration.split("$function$")
          assert len(chunks) >= 3, "Certificate verification function definition missing"
          body = chunks[1].lower()
          for field in ("student_name", "full_name", "display_name", "student_id"):
              assert field not in body, f"Public verifier exposes {field}"
          assert "security definer" in chunks[0].lower(), "Expected SECURITY DEFINER declaration"
          assert "set search_path to ''" in chunks[0].lower(), "Empty search_path must be preserved"
          assert "revoke all on function public.verify_course_certificate(text) from public" in migration.lower()
          assert "grant execute on function public.verify_course_certificate(text) to anon, authenticated, service_role" in migration.lower()
          assert "data.student_name" not in app, "Public UI must not render learner identity"
          assert "without disclosing learner identity" in app.lower(), "Privacy explanation missing"
          print("Certificate privacy assertions passed.")
          PY
